<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Scan Network | IoT Guardian Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-gray-50 font-['Outfit']">
    <div class="flex h-screen overflow-hidden">
      <!-- Sidebar -->
      <aside class="fixed left-0 top-0 z-50 flex h-screen w-[290px] flex-col overflow-y-hidden border-r border-gray-200 bg-white px-5">
        <div class="pt-8 pb-7">
          <a href="/">
            <span class="text-xl font-bold text-[#465fff]">IoT Guardian</span>
          </a>
        </div>
        
        <nav class="flex-1 overflow-y-auto">
          <div>
            <h3 class="mb-4 text-xs font-semibold uppercase text-gray-400">MENU</h3>
            <ul class="flex flex-col gap-2">
              <li>
                <a href="/" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-100">
                  <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
                  </svg>
                  <span>Dashboard</span>
                </a>
              </li>
              <li>
                <a href="/scan" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium bg-[#ecf3ff] text-[#465fff]">
                  <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                  </svg>
                  <span>Scan Network</span>
                </a>
              </li>
              <li>
                <a href="/results" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-100">
                  <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                  </svg>
                  <span>Results</span>
                </a>
              </li>
            </ul>
          </div>
        </nav>
        
        <div class="pb-4">
          <a href="/logout" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-red-600 hover:bg-red-50">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
              <path d="M17 7l-1.41 1.41L18.59 7 20 5.59 17 3 15.59 4.41 17 7zM7 7l-1.41-1.41L5.41 7 4 8.41l1.59 1.59L4 11.59 5.41 13 7 11.59 8.41 10 7 7zm0 14l1.41-1.41L8.59 19l1.59 1.59L7 21l1.41-1.41L7 17l1.59 1.59L7 21l1.41-1.41L7 17V7h10v10h-2l-1.59 1.59L7 17z"/>
            </svg>
            <span>Logout</span>
          </a>
        </div>
      </aside>

      <!-- Main -->
      <div class="ml-[290px] flex flex-col flex-1">
        <header class="sticky top-0 z-40 flex h-16 items-center justify-between border-b border-gray-200 bg-white px-6">
          <h2 class="text-xl font-semibold text-gray-800">Scan Network</h2>
          <span class="text-sm text-gray-600">Welcome, {{ session.get('username', 'Admin') }}</span>
        </header>

        <main class="flex-1 overflow-y-auto p-6">
          <!-- Scan Form -->
          <div class="rounded-lg border border-gray-200 bg-white p-6 mb-6">
            <h3 class="mb-4 text-lg font-semibold text-gray-800">Configure Scan</h3>
            <form id="scanForm" method="POST" action="/scan">
              <div class="mb-4">
                <label class="mb-2 block text-sm font-medium text-gray-700">IP Range</label>
                <input type="text" name="ip_range" value="172.20.44.0/24"
                  class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm focus:border-[#465fff] focus:outline-none" />
                <p class="mt-1 text-xs text-gray-500">e.g., 192.168.1.0/24</p>
              </div>
              <button type="submit" id="scanBtn"
                class="rounded-lg bg-[#465fff] px-4 py-2.5 text-sm font-medium text-white hover:bg-[#3641f5]">
                Start Scan
              </button>
            </form>
          </div>

          <!-- Loading -->
          <div id="loadingIndicator" class="hidden rounded-lg border border-gray-200 bg-white p-6 mb-6">
            <div class="flex items-center justify-center py-8">
              <div class="text-center">
                <svg class="mx-auto h-10 w-10 animate-spin text-[#465fff]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                </svg>
                <p class="mt-3 text-gray-700">Scanning network...</p>
              </div>
            </div>
          </div>

          {% if results %}
          <div class="rounded-lg border border-gray-200 bg-white p-6">
            <h3 class="mb-4 text-lg font-semibold text-gray-800">Scan Results</h3>
            <pre class="overflow-x-auto text-sm text-gray-600 whitespace-pre-wrap">{{ results_json }}</pre>
          </div>
          {% endif %}
        </main>
      </div>
    </div>

    <script>
      document.getElementById('scanForm').addEventListener('submit', function() {
        document.getElementById('loadingIndicator').classList.remove('hidden');
        document.getElementById('scanBtn').disabled = true;
      });
    </script>
  </body>
</html>
