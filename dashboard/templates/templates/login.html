<!DOCTYPE html>
<html>
<head>
  <title>IoT Guardian Admin - Login</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f0f2f5; display:flex; height:100vh; align-items:center; justify-content:center; }
    .card { width: 380px; padding: 24px; border-radius:8px; background:white; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
    h2 { margin:0 0 16px 0; font-size:22px; }
    label { display:block; margin-top:12px; }
    input { width:100%; padding:8px; margin-top:6px; box-sizing:border-box; }
    button { margin-top:16px; padding:10px 16px; background:#007bff; color:white; border:none; border-radius:4px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Admin Login</h2>
    <form method="post" action="/login">
      <label>Username</label>
      <input type="text" name="username" required />
      <label>Password</label>
      <input type="password" name="password" required />
      <button type="submit">Login</button>
    </form>
  </div>
  </body>
</html>
